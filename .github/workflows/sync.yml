name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *" # At 12PM UTC+8
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git || git remote set-url upstream https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git
          git fetch upstream main
          git merge upstream/main -m "Sync with upstream"
          git push origin main

      - name: Sync check
        if: failure()
        run: exit 1
